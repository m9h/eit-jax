[project]
name = "eit-jax"
version = "0.1.0"
description = "Differentiable electrical impedance tomography in JAX: FEM forward model, autodiff Jacobians and nonlinear reconstruction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.38",
    "equinox>=0.11.10",
    "optimistix>=0.0.10",
    "jaxtyping>=0.2.36",
    "numpy>=1.26",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8", "pyeit==1.2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eitjax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
